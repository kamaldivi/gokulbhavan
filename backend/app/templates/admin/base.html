<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Admin{% endblock %} — Gokul Bhavan</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

  <nav class="bg-[#082A4A] text-white px-6 py-3 flex items-center justify-between">
    <span class="font-bold text-lg">Gokul Bhavan · Admin</span>
    <div class="flex gap-6 text-sm">
      <a href="/admin/"               class="hover:underline">Dashboard</a>
      <a href="/admin/events/new"     class="hover:underline">+ Event</a>
      <a href="/admin/programs/new"   class="hover:underline">+ Program</a>
      <a href="/admin/logout"         class="hover:underline text-red-300">Logout</a>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-4 py-10">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <div class="bg-green-100 border border-green-300 text-green-800 rounded px-4 py-2 mb-6 text-sm">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

</body>
</html>
