{% extends "admin/base.html" %}
{% block title %}{{ 'Edit' if event else 'New' }} Event{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-8">{{ 'Edit' if event else 'New' }} Event</h1>

<form method="POST" class="bg-white rounded-xl shadow p-8 space-y-5 max-w-2xl">
  <div class="grid grid-cols-2 gap-4">
    <div class="col-span-2">
      <label class="block text-xs font-semibold uppercase tracking-wide text-gray-500 mb-1">Title *</label>
      <input type="text" name="title" required value="{{ event.title if event else '' }}"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
    </div>
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wide text-gray-500 mb-1">Date *</label>
      <input type="date" name="date" required value="{{ event.date if event else '' }}"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
    </div>
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wide text-gray-500 mb-1">Time *</label>
      <input type="text" name="time" required placeholder="7:00 PM IST" value="{{ event.time if event else '' }}"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
    </div>
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wide text-gray-500 mb-1">Location</label>
      <input type="text" name="location" value="{{ event.location if event else 'Zoom' }}"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
    </div>
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wide text-gray-500 mb-1">Zoom Meeting ID</label>
      <input type="text" name="zoom_id" value="{{ event.zoom_id if event and event.zoom_id else '' }}"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
    </div>
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wide text-gray-500 mb-1">Site</label>
      <select name="site" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
        <option value="gokulbhavan"  {{ 'selected' if not event or event.site == 'gokulbhavan' }}>Gokul Bhavan</option>
        <option value="tamil-sangha" {{ 'selected' if event and event.site == 'tamil-sangha' }}>Tamil Sangha</option>
      </select>
    </div>
    <div class="col-span-2">
      <label class="block text-xs font-semibold uppercase tracking-wide text-gray-500 mb-1">Description</label>
      <textarea name="description" rows="3"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">{{ event.description if event else '' }}</textarea>
    </div>
  </div>

  <div class="flex gap-3 pt-2">
    <button type="submit" class="bg-[#082A4A] hover:bg-[#123C69] text-white font-semibold px-6 py-2.5 rounded-lg transition-colors">
      {{ 'Update' if event else 'Create' }} Event
    </button>
    <a href="/admin/" class="px-6 py-2.5 rounded-lg border border-gray-300 text-sm text-gray-600 hover:bg-gray-50">Cancel</a>
  </div>
</form>
{% endblock %}
