{% extends "admin/base.html" %}
{% block title %}{{ 'Edit' if program else 'New' }} Program{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-8">{{ 'Edit' if program else 'New' }} Program Schedule</h1>

<form method="POST" class="bg-white rounded-xl shadow p-8 space-y-5 max-w-2xl">
  <div class="grid grid-cols-2 gap-4">
    <div class="col-span-2">
      <label class="block text-xs font-semibold uppercase tracking-wide text-gray-500 mb-1">Title *</label>
      <input type="text" name="title" required value="{{ program.title if program else '' }}"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
    </div>
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wide text-gray-500 mb-1">Day of Week *</label>
      <select name="day_of_week" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
        {% for day in ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'] %}
          <option value="{{ day }}" {{ 'selected' if program and program.day_of_week == day }}>{{ day }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wide text-gray-500 mb-1">Duration (min)</label>
      <input type="number" name="duration_min" value="{{ program.duration_min if program else 95 }}"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
    </div>
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wide text-gray-500 mb-1">Time IST *</label>
      <input type="text" name="time_ist" required placeholder="8:00 PM" value="{{ program.time_ist if program else '' }}"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" />
    </div>
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wide text-gray-500 mb-1">Time CST</label>
      <input type="text" name="time_cst" placeholder="9:30 AM" value="{{ program.time_cst if program else '' }}"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" />
    </div>
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wide text-gray-500 mb-1">Time EST</label>
      <input type="text" name="time_est" placeholder="10:30 AM" value="{{ program.time_est if program else '' }}"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" />
    </div>
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wide text-gray-500 mb-1">Zoom Meeting ID</label>
      <input type="text" name="zoom_id" value="{{ program.zoom_id if program and program.zoom_id else '' }}"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" />
    </div>
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wide text-gray-500 mb-1">Language</label>
      <input type="text" name="language" value="{{ program.language if program else 'English' }}"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" />
    </div>
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wide text-gray-500 mb-1">Site</label>
      <select name="site" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
        <option value="gokulbhavan"  {{ 'selected' if not program or program.site == 'gokulbhavan' }}>Gokul Bhavan</option>
        <option value="tamil-sangha" {{ 'selected' if program and program.site == 'tamil-sangha' }}>Tamil Sangha</option>
      </select>
    </div>
    <div class="flex items-center gap-2 pt-4">
      <input type="checkbox" name="active" id="active" value="1" {{ 'checked' if not program or program.active }}
             class="w-4 h-4" />
      <label for="active" class="text-sm font-medium text-gray-700">Active (visible on site)</label>
    </div>
    <div class="col-span-2">
      <label class="block text-xs font-semibold uppercase tracking-wide text-gray-500 mb-1">Description</label>
      <textarea name="description" rows="3"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500">{{ program.description if program else '' }}</textarea>
    </div>
  </div>

  <div class="flex gap-3 pt-2">
    <button type="submit" class="bg-[#082A4A] hover:bg-[#123C69] text-white font-semibold px-6 py-2.5 rounded-lg transition-colors">
      {{ 'Update' if program else 'Create' }} Program
    </button>
    <a href="/admin/" class="px-6 py-2.5 rounded-lg border border-gray-300 text-sm text-gray-600 hover:bg-gray-50">Cancel</a>
  </div>
</form>
{% endblock %}
