{% extends "admin/base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-20 bg-white rounded-xl shadow p-8">
  <h1 class="text-xl font-bold text-gray-800 mb-6">Admin Login</h1>
  <form method="POST" action="/admin/login" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wide text-gray-500 mb-1">Username</label>
      <input type="text" name="username" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
    </div>
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wide text-gray-500 mb-1">Password</label>
      <input type="password" name="password" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" />
    </div>
    <button type="submit"
            class="w-full bg-[#082A4A] hover:bg-[#123C69] text-white font-semibold py-2.5 rounded-lg transition-colors">
      Sign in
    </button>
  </form>
</div>
{% endblock %}
